[package]
name = "app"
version = "1.0.0"
description = "Cloud file synchronization desktop application with AWS S3 support"
authors = ["ohr486"]
license = "MIT"
repository = "https://github.com/ohr486/file-funeral"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"

# AWS SDK
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.117.0"
tokio = { version = "1", features = ["full"] }

# Security
keyring = "3"

# Utility
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
hostname = "0.4"
md5 = "0.7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Tauri Plugins
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Retry and Backoff
backon = "1.2"

# Logging
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
